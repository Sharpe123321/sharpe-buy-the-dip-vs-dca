name: tests

# Offline checks only: the 52 tests that use synthetic data, and the example that makes up its own prices.
# The full pipeline (python run_all.py) downloads from Yahoo, FRED, the Bank of Canada and Dartmouth, and Yahoo
# often blocks cloud runners, so it is not run here.
on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (the same way the README says)
        run: python -m pip install -e ".[test]"
      - name: Tests (the 7 that need downloaded data skip themselves)
        run: python -m pytest -q tests
      - name: Example that runs offline
        run: python examples/bring_your_own_prices.py
